<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fbfdf2;}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fbfdf2; display:flex; gap:24px; align-items:center;}
  .mascot{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .mascot img{width:96px; height:96px;}
  .name{font-family:"Zen Maru Gothic",sans-serif; font-size:13px; font-weight:700; color:#272a18;}
  .label{font-family:"M PLUS Rounded 1c",sans-serif; font-size:11px; color:#6b6f53; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; width:100%;}
</style></head><body>
<div class="card">
  <div style="width:100%;" class="label">P-kun mascot · 3 expressions</div>
  <div class="mascot"><img src="../assets/p-kun/p-kun.svg" alt=""><div class="name">ぴーくん</div></div>
  <div class="mascot"><img src="../assets/p-kun/p-kun-wave.svg" alt=""><div class="name">手をふる</div></div>
  <div class="mascot"><img src="../assets/p-kun/p-kun-sleep.svg" alt=""><div class="name">おやすみ</div></div>
  <div class="mascot"><img src="../assets/logo/logo.svg" alt="" style="width:auto; height:60px;"><div class="name">ロゴ</div></div>
</div>
</body></html>
