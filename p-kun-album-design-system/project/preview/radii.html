<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fff;}
  .row{display:flex; gap:18px; align-items:flex-end;}
  .item{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .box{width:80px; height:80px; background:var(--brand-soft); border:1.5px solid var(--brand);}
  .name{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); font-weight:600;}
  .px{font-family:var(--font-body); font-size:10px; color:var(--fg-subtle);}
  .label{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:14px;}
</style></head><body>
<div class="card">
  <div class="label">Corner radii · soft & generous</div>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">r-sm</div><div class="px">8</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="name">r-md</div><div class="px">14</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="name">r-lg ★</div><div class="px">20</div></div>
    <div class="item"><div class="box" style="border-radius:28px"></div><div class="name">r-xl</div><div class="px">28</div></div>
    <div class="item"><div class="box" style="border-radius:36px"></div><div class="name">r-2xl</div><div class="px">36</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">r-pill</div><div class="px">999</div></div>
  </div>
</div>
</body></html>
