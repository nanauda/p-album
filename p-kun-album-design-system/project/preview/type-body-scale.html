<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fff;}
  .row{display:flex; gap:8px; align-items:baseline; margin-bottom:8px;}
  .size{font-family:var(--font-body); font-size:11px; color:var(--fg-subtle); width:80px; letter-spacing:0.06em;}
  .text{font-family:"M PLUS Rounded 1c", sans-serif; color:var(--fg);}
  .label{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:14px;}
</style></head><body>
<div class="card">
  <div class="label">Body — M PLUS Rounded 1c</div>
  <div class="row"><div class="size">XL · 28</div><div class="text" style="font-size:28px; font-weight:700;">家族のおもいで</div></div>
  <div class="row"><div class="size">LG · 22</div><div class="text" style="font-size:22px; font-weight:700;">最初の1枚をアップロード</div></div>
  <div class="row"><div class="size">MD · 18</div><div class="text" style="font-size:18px; font-weight:500;">きょう、3まいの写真がふえました。</div></div>
  <div class="row"><div class="size">BASE · 16</div><div class="text" style="font-size:16px;">そっとめくれる、家族だけのアルバム。</div></div>
  <div class="row"><div class="size">SM · 14</div><div class="text" style="font-size:14px; color:var(--fg-muted);">2026年4月30日 14時22分</div></div>
  <div class="row"><div class="size">XS · 12</div><div class="text" style="font-size:12px; color:var(--fg-subtle);">最後にひらいたのは1時間まえ</div></div>
</div>
</body></html>
