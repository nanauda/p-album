<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fff;}
  .row{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap;}
  .item{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .box{background:var(--brand-soft); border-radius:8px;}
  .name{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); font-weight:600;}
  .px{font-family:var(--font-body); font-size:10px; color:var(--fg-subtle);}
  .label{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:14px;}
</style></head><body>
<div class="card">
  <div class="label">Spacing scale · 4px grid</div>
  <div class="row">
    <div class="item"><div class="box" style="width:4px;height:32px;"></div><div class="name">sp-1</div><div class="px">4</div></div>
    <div class="item"><div class="box" style="width:8px;height:32px;"></div><div class="name">sp-2</div><div class="px">8</div></div>
    <div class="item"><div class="box" style="width:12px;height:32px;"></div><div class="name">sp-3</div><div class="px">12</div></div>
    <div class="item"><div class="box" style="width:16px;height:32px;"></div><div class="name">sp-4</div><div class="px">16</div></div>
    <div class="item"><div class="box" style="width:20px;height:32px;"></div><div class="name">sp-5</div><div class="px">20</div></div>
    <div class="item"><div class="box" style="width:24px;height:32px;"></div><div class="name">sp-6</div><div class="px">24</div></div>
    <div class="item"><div class="box" style="width:32px;height:32px;"></div><div class="name">sp-8</div><div class="px">32</div></div>
    <div class="item"><div class="box" style="width:40px;height:32px;"></div><div class="name">sp-10</div><div class="px">40</div></div>
    <div class="item"><div class="box" style="width:48px;height:32px;"></div><div class="name">sp-12</div><div class="px">48</div></div>
    <div class="item"><div class="box" style="width:64px;height:32px;"></div><div class="name">sp-16</div><div class="px">64</div></div>
    <div class="item"><div class="box" style="width:80px;height:32px;"></div><div class="name">sp-20</div><div class="px">80</div></div>
  </div>
</div>
</body></html>
