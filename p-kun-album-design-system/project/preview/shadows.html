<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{box-sizing:border-box;padding:32px 24px;width:700px;background:#f3f5e3;}
  .row{display:flex; gap:24px; align-items:flex-end;}
  .item{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .box{width:88px; height:88px; background:#fff; border-radius:18px;}
  .name{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); font-weight:600;}
  .label{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:18px;}
</style></head><body>
<div class="card">
  <div class="label">Shadows · warm-tinted (rgba 70,60,30)</div>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:0 1px 2px rgba(60,70,30,.06)"></div><div class="name">sm</div></div>
    <div class="item"><div class="box" style="box-shadow:0 4px 12px rgba(60,70,30,.08), 0 1px 2px rgba(60,70,30,.04)"></div><div class="name">md ★</div></div>
    <div class="item"><div class="box" style="box-shadow:0 12px 28px rgba(60,70,30,.10), 0 2px 4px rgba(60,70,30,.04)"></div><div class="name">lg</div></div>
    <div class="item"><div class="box" style="box-shadow:0 24px 48px rgba(60,70,30,.12), 0 4px 8px rgba(60,70,30,.04)"></div><div class="name">xl</div></div>
    <div class="item"><div class="box" style="box-shadow:0 8px 20px rgba(40,46,28,.12), 0 1px 3px rgba(40,46,28,.06)"></div><div class="name">photo</div></div>
  </div>
</div>
</body></html>
