<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  html,body{margin:0;padding:0;background:#fbfdf2;}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fbfdf2;}
  .row{display:flex; gap:18px; flex-wrap:wrap;}
  .ic{display:flex; flex-direction:column; align-items:center; gap:6px; width:72px;}
  .ic i{font-size:32px; color:#97a05c;}
  .ic .n{font-family:"M PLUS Rounded 1c",sans-serif; font-size:11px; color:#6b6f53;}
  .label{font-family:"M PLUS Rounded 1c",sans-serif; font-size:11px; color:#6b6f53; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:16px;}
</style></head><body>
<div class="card">
  <div class="label">Iconography · Phosphor Duotone</div>
  <div class="row">
    <div class="ic"><i class="ph-duotone ph-image"></i><div class="n">写真</div></div>
    <div class="ic"><i class="ph-duotone ph-images-square"></i><div class="n">アルバム</div></div>
    <div class="ic"><i class="ph-duotone ph-upload-simple"></i><div class="n">アップ</div></div>
    <div class="ic"><i class="ph-duotone ph-clock-counter-clockwise"></i><div class="n">履歴</div></div>
    <div class="ic"><i class="ph-duotone ph-house"></i><div class="n">ホーム</div></div>
    <div class="ic"><i class="ph-duotone ph-users-three"></i><div class="n">家族</div></div>
    <div class="ic"><i class="ph-duotone ph-heart"></i><div class="n">お気に入り</div></div>
    <div class="ic"><i class="ph-duotone ph-magnifying-glass"></i><div class="n">さがす</div></div>
    <div class="ic"><i class="ph-duotone ph-gear"></i><div class="n">設定</div></div>
    <div class="ic"><i class="ph-duotone ph-bell"></i><div class="n">お知らせ</div></div>
    <div class="ic"><i class="ph-duotone ph-calendar-blank"></i><div class="n">カレンダー</div></div>
    <div class="ic"><i class="ph-duotone ph-share-network"></i><div class="n">共有</div></div>
  </div>
</div>
</body></html>
