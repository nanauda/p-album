<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fff;}
  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .btn{
    font-family:var(--font-body); font-weight:700; font-size:15px;
    padding:12px 22px; border-radius:999px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    transition: all 200ms cubic-bezier(.22,1,.36,1);
  }
  .btn-primary{ background:#97a05c; color:#fff; box-shadow: 0 4px 12px rgba(60,70,30,.08); }
  .btn-secondary{ background:#ffe6c8; color:#8a4d0c; }
  .btn-ghost{ background:transparent; color:#42452f; }
  .btn-danger{ background:#ffe6ec; color:#b53a5a; }
  .btn.sm{ padding:8px 16px; font-size:13px; }
  .btn.lg{ padding:16px 28px; font-size:17px; }
  .btn:hover{ transform: translateY(-1px); box-shadow: 0 8px 20px rgba(60,70,30,.12); }
  .btn-primary:hover{ background:#7a8347; }
  .label{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:14px;}
  .group{margin-bottom:14px;}
  .group-title{font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--fg-muted); margin-bottom:10px;}
</style></head><body>
<div class="card">
  <div class="label">Buttons · pill-shaped, soft</div>
  <div class="group">
    <div class="group-title">Variants</div>
    <div class="row">
      <button class="btn btn-primary">写真をアップロード</button>
      <button class="btn btn-secondary">あとで</button>
      <button class="btn btn-ghost">キャンセル</button>
      <button class="btn btn-danger">削除する</button>
    </div>
  </div>
  <div class="group">
    <div class="group-title">Sizes</div>
    <div class="row">
      <button class="btn btn-primary sm">追加</button>
      <button class="btn btn-primary">追加する</button>
      <button class="btn btn-primary lg">アルバムを作る</button>
    </div>
  </div>
</div>
</body></html>
