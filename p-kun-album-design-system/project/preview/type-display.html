<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--bg);}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fff;}
  .row{display:flex; gap:24px; align-items:baseline;}
  .col{flex:1;}
  .label{font-family:var(--font-body); font-size:11px; color:var(--fg-muted); letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:6px;}
  .specimen{font-family:"Zen Maru Gothic", sans-serif; color:var(--fg);}
</style></head><body>
<div class="card">
  <div class="row">
    <div class="col">
      <div class="label">Display · Zen Maru Gothic</div>
      <div class="specimen" style="font-size:48px; font-weight:900; line-height:1.1;">ぴーくん</div>
      <div class="specimen" style="font-size:48px; font-weight:900; line-height:1.1; color:var(--brand);">アルバム</div>
    </div>
    <div class="col">
      <div class="label">Aa Bb 12345 あいうえお</div>
      <div class="specimen" style="font-size:32px; font-weight:700;">Aa Bb 가</div>
      <div class="specimen" style="font-size:18px; font-weight:500; color:var(--fg-muted); margin-top:8px;">家族のおもいで、しずかに重ねていく。</div>
    </div>
  </div>
</div>
</body></html>
