<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  html,body{margin:0;padding:0;background:#fbfdf2;}
  .card{box-sizing:border-box;padding:32px;width:700px;background:#ffe6c8; border-radius:0;
    display:flex; align-items:center; gap:24px; min-height:200px;
    background-image: radial-gradient(#ffb558 1.5px, transparent 1.5px);
    background-size: 24px 24px; background-position: 0 0;}
  .panel{background:#fff; padding:24px 28px; border-radius:24px; box-shadow:0 12px 28px rgba(60,70,30,.10); display:flex; gap:18px; align-items:center;}
  .panel img{width:80px; height:80px;}
  .panel h3{font-family:"Zen Maru Gothic",sans-serif; margin:0 0 6px 0; font-size:22px; font-weight:700; color:#272a18;}
  .panel p{font-family:"M PLUS Rounded 1c",sans-serif; margin:0; font-size:14px; color:#6b6f53; line-height:1.6;}
  .label{font-family:"M PLUS Rounded 1c",sans-serif; font-size:11px; color:#8a4d0c; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; position:absolute; top:16px; left:24px;}
</style></head><body>
<div class="card" style="position:relative;">
  <div class="label">Empty state · with mascot</div>
  <div class="panel">
    <img src="../assets/p-kun/p-kun-sleep.svg" alt="">
    <div>
      <h3>まだ写真がありません</h3>
      <p>最初の1枚を追加してみませんか？<br>ぴーくんも待ってるよ〜</p>
    </div>
  </div>
</div>
</body></html>
