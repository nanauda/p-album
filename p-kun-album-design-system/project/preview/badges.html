<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:#fbfdf2;}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fbfdf2;}
  .row{display:flex; gap:12px; flex-wrap:wrap;}
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 14px; border-radius:999px;
    font-family:"M PLUS Rounded 1c",sans-serif; font-weight:600; font-size:13px;
  }
  .label{font-family:"M PLUS Rounded 1c",sans-serif; font-size:11px; color:#6b6f53; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; margin-bottom:12px;}
  .dot{width:8px; height:8px; border-radius:999px;}
</style></head><body>
<div class="card">
  <div class="label">Badges & chips</div>
  <div class="row">
    <span class="badge" style="background:#e9ecd2; color:#5d6535;">家族</span>
    <span class="badge" style="background:#ffe6c8; color:#8a4d0c;">2歳</span>
    <span class="badge" style="background:#ffe6ec; color:#b53a5a;">お気に入り</span>
    <span class="badge" style="background:#d2f0db; color:#2a8a4a;">公園</span>
    <span class="badge" style="background:#ebe6ff; color:#6a5cb8;">ひなた</span>
    <span class="badge" style="background:#fff; color:#42452f; border:1.5px solid #e7ecd0;">+ 3</span>
  </div>
  <div style="height:14px"></div>
  <div class="row">
    <span class="badge" style="background:#d2f0db; color:#2a8a4a;"><span class="dot" style="background:#45b06a"></span>アップロード完了</span>
    <span class="badge" style="background:#e9ecd2; color:#5d6535;"><span class="dot" style="background:#97a05c"></span>新しい12枚</span>
    <span class="badge" style="background:#ffe6c8; color:#8a4d0c;"><span class="dot" style="background:#f5942a"></span>処理中</span>
  </div>
</div>
</body></html>
