<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  html,body{margin:0;padding:0;background:#fbfdf2;}
  .card{box-sizing:border-box;padding:24px;width:700px;background:#fbfdf2; display:flex; gap:18px; align-items:center;}
  .ava{
    width:64px; height:64px; border-radius:999px; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    font-family:"Zen Maru Gothic", sans-serif; font-weight:900; font-size:24px;
    border: 3px solid #fff; box-shadow: 0 4px 12px rgba(60,70,30,.10);
  }
  .ava.lg{width:96px;height:96px;font-size:36px; border-width:4px;}
  .ava.sm{width:40px;height:40px;font-size:15px; border-width:2px;}
  .label{font-family:"M PLUS Rounded 1c",sans-serif; font-size:11px; color:#6b6f53; letter-spacing:0.1em; text-transform:uppercase; font-weight:600; width:100%;}
</style></head><body>
<div class="card">
  <div style="width:100%;" class="label">Avatars · child & family circles</div>
  <div class="ava lg" style="background:#d3d8a8; color:#5d6535;">ひ</div>
  <div class="ava" style="background:#ffc9d6; color:#b53a5a;">あ</div>
  <div class="ava" style="background:#d2f0db; color:#2a8a4a;">そ</div>
  <div class="ava" style="background:#ffe6c8; color:#8a4d0c;">ま</div>
  <div class="ava sm" style="background:#ebe6ff; color:#6a5cb8;">じ</div>
  <div class="ava sm" style="background:#c2c8a3; color:#42452f;">+5</div>
</div>
</body></html>
